name: Publish Release
run-name: Publish ${{ inputs.tag }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        required: true
        default: false

jobs:
  build:
    strategy:
      matrix:
        goos: [ linux ]
        goarch: [ arm64, 386, riscv64, loong64, mips64, mips64le, mipsle, mips, ppc64, ppc64le, s390x ]
        include:
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Linux AMD64 v1 v2 v3
          - goos: linux
            goarch: amd64
            goamd64: v1
          - goos: linux
            goarch: amd64
            goamd64: v2
          - goos: linux
            goarch: amd64
            goamd64: v3
          # END Linux AMD64 v1 v2 v3
          # BEGIN Linux RISCV64 rva20u64 rva22u64 rva23u64
          - goos: linux
            goarch: riscv64
            goriscv64: rva20u64
          - goos: linux
            goarch: riscv64
            goriscv64: rva22u64
          - goos: linux
            goarch: riscv64
            goriscv64: rva23u64
          # END Linux RISCV64 rva20u64 rva22u64 rva23u64
      fail-fast: false

    runs-on: ubuntu-26.04
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOAMD64: ${{ matrix.goamd64 }}
      GORISCV64: ${{ matrix.goriscv64 }}
      CGO_ENABLED: 0
      OIXCLOUD_DNS_AUTH_PRIVATE_KEY: ${{ secrets.OIXCLOUD_DNS_AUTH_PRIVATE_KEY }}
      OIXCLOUD_DNS_AUTH_REQUIRE_PRIVATE_KEY: "1"
      OIXCLOUD_SUBSCRIPTION_HMAC_KEY: ${{ secrets.OIXCLOUD_SUBSCRIPTION_HMAC_KEY }}
      OIXCLOUD_SUBSCRIPTION_REQUIRE_HMAC_KEY: "1"

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Get the version
        id: get_version
        env:
          REF: ${{ inputs.tag }}
        run: |
          version=${REF}
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOAMD64$GORISCV64\"].friendlyName" -r < install/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Go cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15

      - name: Get project dependencies
        run: |
          git submodule update --init --recursive
          GOMODCACHE="${PWD}"/go-mod go mod download -modcacherw
          find ./go-mod/ -maxdepth 1 ! -name "cache" ! -name "go-mod" -exec rm -rf {} \;
          sed -i 's/#export GOMODCACHE=$(PWD)\/go-mod/export GOMODCACHE=$(PWD)\/go-mod/' Makefile

      - name: Create directory for placing archives & packages temporarily
        run: mkdir -p ./bundled/

      - name: Create full source archive
        if: matrix.goarch == 'arm64'
        run: |
          zip -9vr ./bundled/dae-full-src.zip . -x .git/\* bundled/\*
          tar -I 'xz -9' -cvf ./bundled/dae-full-src.tar.xz --exclude .git --exclude bundled .

      - name: Build dae
        run: |
          export CGO_ENABLED=0
          export GOFLAGS="-trimpath -modcacherw"
          # Go 1.26 optimization: newinliner, simd, heapminimum512kib, and randomizedheapbase64.
          export GOEXPERIMENT="newinliner,simd,heapminimum512kib,randomizedheapbase64"
          export OUTPUT=pkgdir/usr/bin/dae
          export VERSION=${{ env.VERSION }}
          export CLANG=clang-15
          export STRIP=llvm-strip-15
          make
          install -Dm644 ./install/dae.service -t ./pkgdir/usr/lib/systemd/system/
          install -Dm640 ./example.dae -t ./pkgdir/etc/dae/
          install -d ./pkgdir/usr/share/dae/
          curl -L -o ./pkgdir/usr/share/dae/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -L -o ./pkgdir/usr/share/dae/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          install -D pkgdir/usr/share/dae/geo{ip,site}.dat install/{dae.service,empty.dae} example.dae -t ./zip/
          install -D pkgdir/usr/bin/dae ./zip/dae-$ASSET_NAME

      - name: Smoking test
        if: matrix.goarch == 'amd64' && matrix.goamd64 == 'v1'
        run: ./pkgdir/usr/bin/dae --version

      - name: Create binary archive
        run: |
          tar -I 'xz -9' -cvf ./bundled/dae-$ASSET_NAME.tar.xz -C pkgdir .
          cd zip
          zip -9vr ../bundled/dae-$ASSET_NAME.zip .

      - name: Build Linux packages
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y debsigs libarchive-tools rpm
          sudo gem install fpm

          package_version="${VERSION#v}"
          if [[ "$package_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)[.~-]?(rc|beta|alpha)[.-]?([0-9]+)$ ]]; then
            package_version="${BASH_REMATCH[1]}~${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
          fi

          pkg_managers=(deb rpm)
          case "$GOARCH" in
            amd64 | arm64 | arm | riscv64 | loong64 | ppc64 | ppc64le)
              pkg_managers+=(pacman)
              ;;
          esac

          for pkg_mgr in "${pkg_managers[@]}"; do
            case "$GOARCH" in
              amd64)
                if [ "$pkg_mgr" = 'deb' ]; then pkg_arch='amd64'; else pkg_arch='x86_64'; fi
                ;;
              386)
                pkg_arch='i386'
                ;;
              arm64)
                if [ "$pkg_mgr" = 'deb' ]; then pkg_arch='arm64'; else pkg_arch='aarch64'; fi
                ;;
              arm)
                case "$pkg_mgr" in
                  deb) pkg_arch='armhf' ;;
                  rpm) pkg_arch='armv7hl' ;;
                  pacman) pkg_arch='armv7h' ;;
                esac
                ;;
              loong64)
                if [ "$pkg_mgr" = 'rpm' ]; then pkg_arch='loongarch64'; else pkg_arch='loong64'; fi
                ;;
              mips64le) pkg_arch='mips64el' ;;
              mipsle) pkg_arch='mipsel' ;;
              ppc64le)
                if [ "$pkg_mgr" = 'deb' ]; then pkg_arch='ppc64el'; else pkg_arch='ppc64le'; fi
                ;;
              *) pkg_arch="$GOARCH" ;;
            esac

            fpm -s dir -t "$pkg_mgr" -a "$pkg_arch" -v "$package_version" -n dae \
                  --url "https://github.com/oixcloud3rd/dae" \
                  --description "eBPF-based Linux high-performance transparent proxy solution" \
                  --vendor "daeuniverse" \
                  --maintainer "oixCloud3rd <oixcloud3rd@akinokaede.com>" \
                  --license 'AGPL-3.0-only' \
                  --package ./bundled/dae-$ASSET_NAME.$pkg_mgr \
                  --after-install ./install/package_after_install.sh \
                  --after-remove ./install/package_after_remove.sh \
                  --deb-compression xz \
                  --deb-compression-level 9 \
                  --rpm-compression xz \
                  --verbose \
                  -C pkgdir .
          done

          if [ -f ./bundled/dae-$ASSET_NAME.pacman ]; then
            mv ./bundled/dae-$ASSET_NAME.pacman ./bundled/dae-$ASSET_NAME.pkg.tar.zst
          fi

      - name: Set up package signing
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          SIGNING_GNUPG_HOME="$RUNNER_TEMP/package-signing-gnupg"
          SIGNING_PASSPHRASE_FILE="$RUNNER_TEMP/package-signing-passphrase"
          SIGNING_PUBLIC_KEY_FILE="$RUNNER_TEMP/package-signing-public.asc"
          mkdir -m 700 "$SIGNING_GNUPG_HOME"
          printf '%s' "$GPG_PASSPHRASE" > "$SIGNING_PASSPHRASE_FILE"
          chmod 600 "$SIGNING_PASSPHRASE_FILE"
          {
            echo "GNUPGHOME=$SIGNING_GNUPG_HOME"
            echo "SIGNING_PASSPHRASE_FILE=$SIGNING_PASSPHRASE_FILE"
            echo "SIGNING_PUBLIC_KEY_FILE=$SIGNING_PUBLIC_KEY_FILE"
          } >> "$GITHUB_ENV"
          printf '%s' "$GPG_KEY" | gpg \
            --homedir "$SIGNING_GNUPG_HOME" \
            --batch \
            --pinentry-mode loopback \
            --passphrase-file "$SIGNING_PASSPHRASE_FILE" \
            --import
          gpg \
            --homedir "$SIGNING_GNUPG_HOME" \
            --batch \
            --armor \
            --export "$GPG_KEY_ID" > "$SIGNING_PUBLIC_KEY_FILE"
          cat > "$HOME/.rpmmacros" <<EOF
          %_gpg_name $GPG_KEY_ID
          %_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE
          EOF

      - name: Sign Linux packages
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          debsigs \
            --sign=origin \
            -k "$GPG_KEY_ID" \
            --gpgopts "--batch --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE" \
            ./bundled/*.deb
          rpmsign --addsign ./bundled/*.rpm

      - name: Verify Linux package signatures
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        run: |
          set -euo pipefail
          ar t ./bundled/*.deb | grep -qx '_gpgorigin'
          RPM_VERIFY_DB="$RUNNER_TEMP/rpm-signature-verification"
          mkdir -p "$RPM_VERIFY_DB"
          rpm --dbpath "$RPM_VERIFY_DB" --initdb
          rpm --dbpath "$RPM_VERIFY_DB" --import "$SIGNING_PUBLIC_KEY_FILE"
          rpm --dbpath "$RPM_VERIFY_DB" --checksig ./bundled/*.rpm

      - name: Create signature
        run: |
          cd bundled
          for FILE in *; do
            echo "$(md5sum $FILE)""  md5" >> $FILE.dgst
            echo "$(shasum -a 1 $FILE)""  sha1" >> $FILE.dgst
            echo "$(shasum -a 256 $FILE)""  sha256" >> $FILE.dgst
            echo "$(shasum -a 512 $FILE)""  sha512" >> $FILE.dgst
          done

      - name: Upload files to Artifacts
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          if-no-files-found: ignore
          path: ./bundled/*

  publish-packages:
    name: Publish packages
    if: github.event_name != 'push'
    needs: [build]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.4
        with:
          path: packages/

      - name: Upload packages to Gemfury
        run: |-
          find packages -type f \( -name '*.deb' -o -name '*.rpm' \) \
            ! -name '*_v2_sse.*' \
            ! -name '*_v3_avx2.*' \
            ! -name '*_rva20u64.*' \
            ! -name '*_rva22u64.*' \
            ! -name '*_rva23u64.*' \
            -print0 |
            xargs -0 -r -I {} curl \
              -F "package=@{}" \
              https://${{ secrets.FURY_TOKEN }}@push.fury.io/oixcloud3rd/

  upload-release:
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.4
        with:
          path: release/

      - name: Prepare files for upload
        run: |
          echo "Show files are going to upload..."
          cd release
          ls -lh */*

      - name: Upload full source and artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*/*
          prerelease: ${{ inputs.prerelease }}

  docker:
    name: Publish Docker images
    needs: [upload-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.tag }}
      latest: ${{ !inputs.prerelease }}
      latest_prerelease: true
    secrets: inherit
