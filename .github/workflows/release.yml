name: Publish Release
run-name: Publish ${{ inputs.tag }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (tag commit, asset names)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      # The release must be built from the tag, not from a modified tree: the
      # workflow used to `sed -i` the Makefile before packing dae-full-src.zip,
      # so the published "corresponding source" no longer matched the tag.
      - name: Assert the working tree matches the tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree differs from tag ${{ inputs.tag }}"
            git status --porcelain
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Every matrix leg resolves its own name in the build job with `jq -er`;
      # this is the other half of the invariant (no two keys share a name).
      - name: Assert release asset names are unique
        run: ./scripts/check-asset-names.sh install/friendly-filenames.json

  # Run gates on the resolved tag commit: path-filtered push checks may be absent.
  go-test:
    needs: [preflight]
    uses: ./.github/workflows/go-test.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  bpf-test:
    needs: [preflight]
    uses: ./.github/workflows/bpf-test.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  lint:
    needs: [preflight]
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  build:
    needs: [preflight, go-test, bpf-test, lint]
    strategy:
      matrix:
        goos: [ linux ]
        goarch: [ arm64, 386, riscv64, loong64, mips64, mips64le, mipsle, mips, ppc64, ppc64le, s390x ]
        include:
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Linux AMD64 v1 v2 v3
          - goos: linux
            goarch: amd64
            goamd64: v1
          - goos: linux
            goarch: amd64
            goamd64: v2
          - goos: linux
            goarch: amd64
            goamd64: v3
          # END Linux AMD64 v1 v2 v3
          # NOTE : GitHub currently runs a single `linux, riscv64` job
          # for these three entries (upstream Build (Main) run 32984376230 and
          # dae-linux-riscv64.zip), so the rva22u64/rva23u64 builds these
          # entries declare are never produced at all. All four possible
          # GORISCV64 keys are nevertheless present in
          # install/friendly-filenames.json, because the per-leg `jq -er`
          # lookup now fails the build instead of publishing `dae-null.zip`
          # when a leg carries a value the JSON does not know.
          # BEGIN Linux RISCV64 rva20u64 rva22u64 rva23u64
          - goos: linux
            goarch: riscv64
            goriscv64: rva20u64
          - goos: linux
            goarch: riscv64
            goriscv64: rva22u64
          - goos: linux
            goarch: riscv64
            goriscv64: rva23u64
          # END Linux RISCV64 rva20u64 rva22u64 rva23u64
      fail-fast: false

    runs-on: ubuntu-22.04
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOAMD64: ${{ matrix.goamd64 }}
      GORISCV64: ${{ matrix.goriscv64 }}
      CGO_ENABLED: 0
      OIXCLOUD_DNS_AUTH_PRIVATE_KEY: ${{ secrets.OIXCLOUD_DNS_AUTH_PRIVATE_KEY }}
      OIXCLOUD_DNS_AUTH_REQUIRE_PRIVATE_KEY: "1"
      OIXCLOUD_SUBSCRIPTION_HMAC_KEY: ${{ secrets.OIXCLOUD_SUBSCRIPTION_HMAC_KEY }}
      OIXCLOUD_SUBSCRIPTION_REQUIRE_HMAC_KEY: "1"

    steps:
      - name: Checkout codebase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Get the version
        id: get_version
        env:
          REF: ${{ inputs.tag }}
        run: |
          version=${REF}
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Show workflow information
        id: get_filename
        run: |
          set -euo pipefail
          key="$GOOS-$GOARCH$GOARM$GOAMD64$GORISCV64"
          if ! _NAME=$(jq -er --arg k "$key" '.[$k].friendlyName' < install/friendly-filenames.json); then
            echo "::error::no friendly filename for matrix key '$key' in install/friendly-filenames.json; add it with a unique friendlyName before publishing"
            exit 1
          fi
          # Printing the lookup key makes it self-evident in the log which
          # GORISCV64/GOARM/GOAMD64 values a matrix leg resolved with (the
          # riscv64 include entries collapse to one leg, so this is the only
          # place the surviving value becomes visible).
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOAMD64: $GOAMD64, GORISCV64: $GORISCV64"
          echo "matrix key: $key -> RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go 1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26
          cache: false

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-1.26-

      - name: Cache Go build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-1.26-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.goarm }}-${{ matrix.goamd64 }}-${{ matrix.goriscv64 }}-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-build-1.26-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.goarm }}-${{ matrix.goamd64 }}-${{ matrix.goriscv64 }}-

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15

      - name: Get project dependencies
        run: |
          git submodule update --init --recursive
          go mod download -modcacherw

      - name: Create directory for placing archives & packages temporarily
        run: mkdir -p ./bundled/

      - name: Create full source archive
        if: matrix.goarch == 'arm64'
        run: |
          zip -9vr ./bundled/dae-full-src.zip . -x .git/\* bundled/\*
          tar -I 'xz -9' -cvf ./bundled/dae-full-src.tar.xz --exclude .git --exclude bundled .

      - name: Build dae
        env:
          # Build inputs are passed to the build, never written into the
          # Makefile: an edited Makefile is no longer the tag being released
          # (the full-source archive above is packed from the same checkout).
          GOFLAGS: "-modcacherw"
        run: |
          export CGO_ENABLED=0
          export OUTPUT=pkgdir/usr/bin/dae
          export VERSION=${{ env.VERSION }}
          export CLANG=clang-15
          export STRIP=llvm-strip-15
          make
          install -Dm644 ./install/dae.service -t ./pkgdir/usr/lib/systemd/system/
          install -Dm640 ./example.dae -t ./pkgdir/etc/dae/
          install -d ./pkgdir/usr/share/dae/
          ./scripts/fetch-geo-data.sh ./pkgdir/usr/share/dae
          install -D pkgdir/usr/share/dae/geo{ip,site}.dat install/{dae.service,empty.dae} example.dae -t ./zip/
          install -D pkgdir/usr/bin/dae ./zip/dae-$ASSET_NAME

      - name: Assert artifact build inputs (trace tag, GOEXPERIMENT)
        run: ./scripts/check-artifact-build-env.sh "pkgdir/usr/bin/dae" "$GOARCH"

      - name: Smoking test
        if: matrix.goarch == 'amd64' && matrix.goamd64 == 'v1'
        run: ./pkgdir/usr/bin/dae --version

      - name: Create binary archive
        run: |
          tar -I 'xz -9' -cvf ./bundled/dae-$ASSET_NAME.tar.xz -C pkgdir .
          cd zip
          zip -9vr ../bundled/dae-$ASSET_NAME.zip .

      - name: Build Linux packages
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y debsigs libarchive-tools rpm
          sudo gem install fpm
          sudo patch --forward --batch /usr/bin/debsigs < .github/patches/debsigs-gpgopts.patch

          pkg_managers=(deb rpm)
          case "$GOARCH" in
            amd64 | arm64 | arm | riscv64 | loong64 | ppc64 | ppc64le)
              pkg_managers+=(pacman)
              ;;
          esac

          for pkg_mgr in "${pkg_managers[@]}"; do
            case "$GOARCH" in
              amd64)
                if [ "$pkg_mgr" = 'deb' ]; then pkg_arch='amd64'; else pkg_arch='x86_64'; fi
                ;;
              386)
                case "$pkg_mgr" in
                  deb) pkg_arch='i386' ;;
                  rpm) pkg_arch='x86' ;;
                  pacman) pkg_arch='i486' ;;
                esac
                ;;
              arm64)
                if [ "$pkg_mgr" = 'deb' ]; then pkg_arch='arm64'; else pkg_arch='aarch64'; fi
                ;;
              arm)
                case "$pkg_mgr" in
                  deb) pkg_arch='armhf' ;;
                  rpm) pkg_arch='armhfp' ;;
                  pacman) pkg_arch='armv7h' ;;
                esac
                ;;
              loong64)
                if [ "$pkg_mgr" = 'rpm' ]; then pkg_arch='loongarch64'; else pkg_arch='loong64'; fi
                ;;
              mips64le) pkg_arch='mips64el' ;;
              mipsle) pkg_arch='mipsel' ;;
              ppc64le)
                if [ "$pkg_mgr" = 'deb' ]; then pkg_arch='ppc64el'; else pkg_arch='ppc64le'; fi
                ;;
              *) pkg_arch="$GOARCH" ;;
            esac

            fpm -s dir -t $pkg_mgr -a $pkg_arch -v ${VERSION/v/} -n dae \
                  --url "https://github.com/oixcloud3rd/dae" \
                  --description "eBPF-based Linux high-performance transparent proxy solution" \
                  --vendor "daeuniverse" \
                  --maintainer "oixCloud3rd <oixcloud3rd@akinokaede.com>" \
                  --license 'AGPL-3.0-only' \
                  --package ./bundled/dae-$ASSET_NAME.$pkg_mgr \
                  --after-install ./install/package_after_install.sh \
                  --after-remove ./install/package_after_remove.sh \
                  --deb-compression xz \
                  --deb-compression-level 9 \
                  --rpm-compression xz \
                  --verbose \
                  -C pkgdir .
          done

          if [ -f ./bundled/dae-$ASSET_NAME.pacman ]; then
            mv ./bundled/dae-$ASSET_NAME.pacman ./bundled/dae-$ASSET_NAME.pkg.tar.zst
          fi

      - name: Set up package signing
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          SIGNING_GNUPG_HOME="$RUNNER_TEMP/package-signing-gnupg"
          SIGNING_PASSPHRASE_FILE="$RUNNER_TEMP/package-signing-passphrase"
          SIGNING_PUBLIC_KEY_FILE="$RUNNER_TEMP/package-signing-public.asc"
          mkdir -m 700 "$SIGNING_GNUPG_HOME"
          printf '%s' "$GPG_PASSPHRASE" > "$SIGNING_PASSPHRASE_FILE"
          chmod 600 "$SIGNING_PASSPHRASE_FILE"
          {
            echo "GNUPGHOME=$SIGNING_GNUPG_HOME"
            echo "SIGNING_PASSPHRASE_FILE=$SIGNING_PASSPHRASE_FILE"
            echo "SIGNING_PUBLIC_KEY_FILE=$SIGNING_PUBLIC_KEY_FILE"
          } >> "$GITHUB_ENV"
          printf '%s' "$GPG_KEY" | gpg \
            --homedir "$SIGNING_GNUPG_HOME" \
            --batch \
            --pinentry-mode loopback \
            --passphrase-file "$SIGNING_PASSPHRASE_FILE" \
            --import
          gpg \
            --homedir "$SIGNING_GNUPG_HOME" \
            --batch \
            --armor \
            --export "$GPG_KEY_ID" > "$SIGNING_PUBLIC_KEY_FILE"
          cat > "$HOME/.rpmmacros" <<EOF
          %_gpg_name $GPG_KEY_ID
          %_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE
          EOF

      - name: Sign Linux packages
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          debsigs \
            --sign=origin \
            -k "$GPG_KEY_ID" \
            --gpgopts "--batch --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE" \
            ./bundled/*.deb
          rpmsign --addsign ./bundled/*.rpm

      - name: Verify Linux package signatures
        if: ${{ env.GOARM == '7' || env.GOARM == '' }}
        run: |
          set -euo pipefail
          ar t ./bundled/*.deb | grep -qx '_gpgorigin'
          RPM_VERIFY_DB="$RUNNER_TEMP/rpm-signature-verification"
          mkdir -p "$RPM_VERIFY_DB"
          rpm --dbpath "$RPM_VERIFY_DB" --initdb
          rpm --dbpath "$RPM_VERIFY_DB" --import "$SIGNING_PUBLIC_KEY_FILE"
          rpm --dbpath "$RPM_VERIFY_DB" --checksig ./bundled/*.rpm

      - name: Create signature
        run: |
          cd bundled
          for FILE in *; do
            echo "$(md5sum $FILE)""  md5" >> $FILE.dgst
            echo "$(shasum -a 1 $FILE)""  sha1" >> $FILE.dgst
            echo "$(shasum -a 256 $FILE)""  sha256" >> $FILE.dgst
            echo "$(shasum -a 512 $FILE)""  sha512" >> $FILE.dgst
          done

      - name: Upload files to Artifacts
        uses: nanoufo/action-upload-artifacts-and-release-assets@aa7eaa0c3c20b6bd65f8eba0634e555e59efc57a # v2
        with:
          if-no-files-found: ignore
          path: ./bundled/*

  publish-packages:
    name: Publish packages
    if: github.event_name != 'push'
    needs: [build]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.4
        with:
          path: packages/

      - name: Upload packages to Gemfury
        run: |-
          find packages -type f \( -name '*.deb' -o -name '*.rpm' \) \
            ! -name '*_v2_sse.*' \
            ! -name '*_v3_avx2.*' \
            ! -name '*_rva20u64.*' \
            ! -name '*_rva22u64.*' \
            ! -name '*_rva23u64.*' \
            -print0 |
            xargs -0 -r -I {} curl \
              -F "package=@{}" \
              https://${{ secrets.FURY_TOKEN }}@push.fury.io/oixcloud3rd/

  upload-release:
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    # Only this job may write: action-gh-release attaches the assets to the tag.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          path: release/

      - name: Prepare files for upload
        run: |
          echo "Show files are going to upload..."
          cd release
          ls -lh */*

      - name: Upload full source and artifacts to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*/*
          prerelease: ${{ inputs.prerelease }}

  docker:
    name: Publish Docker images
    needs: [upload-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.tag }}
      latest: ${{ !inputs.prerelease }}
      latest_prerelease: true
    secrets: inherit
