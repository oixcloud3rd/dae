name: Docker

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag version you want to build"
        type: string
        required: true
      latest:
        description: "Also publish the latest tag"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag version you want to build"
        type: string
        required: false
      latest:
        description: "Also publish the latest tag"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main-patch
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Get commit to build
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |-
          if [[ -z "$INPUT_TAG" ]]; then
            ref="$REF_NAME"
          else
            ref="$INPUT_TAG"
          fi
          echo "ref=$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.latest }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "workflow_dispatch" && -z "$INPUT_TAG" ) ]]; then
            date=$(git log -1 --format="%cd" --date=short | sed s/-//g)
            count=$(git rev-list --count HEAD)
            commit=$(git rev-parse --short HEAD)
            version="unstable-${date}.r${count}.${commit}"
          else
            version="$REF"
          fi
          echo "version=$version"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${REGISTRY_IMAGE}:${version}"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo "${REGISTRY_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm/v7,linux/arm64,linux/amd64,linux/386
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            oixcloud_dns_auth_private_key=${{ secrets.OIXCLOUD_DNS_AUTH_PRIVATE_KEY }}
            oixcloud_subscription_hmac_key=${{ secrets.OIXCLOUD_SUBSCRIPTION_HMAC_KEY }}
